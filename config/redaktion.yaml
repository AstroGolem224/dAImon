# T-7.2 -- was gar nicht erst mitgeschnitten wird.
#
# Die Eintraege sind `.desktop`-KENNUNGEN, nicht Fenstertitel und nicht
# Programmnamen. Nachschlagen laesst sich die Kennung so:
#
#     ls /usr/share/applications ~/.local/share/applications
#     grep -l StartupWMClass /usr/share/applications/*.desktop
#
# Der Recorder loest KWins `resource_class` gegen diese Kennungen auf. Wer
# eine Anwendung eintraegt, die keine `.desktop`-Datei hat, traegt ihre
# Fensterklasse ein -- der Rueckfall greift.
#
# Gross- und Kleinschreibung ist egal. Ein unbekanntes Fenster (keine Klasse
# gemeldet) wird GESPERRT, nicht durchgelassen; das steht im Code und nicht
# hier, weil es keine Einstellung ist.

denylist:
  # Passwortmanager. Der Grund braucht keine Erklaerung, aber einen Namen:
  # ein Mitschnitt eines entsperrten Tresors ist der Tresor.
  - org.keepassxc.KeePassXC
  - keepassxc
  - org.gnome.World.Secrets
  - bitwarden
  - com.bitwarden.desktop
  - 1password
  - KeePass2

  # Banking und Bezahlen.
  - org.kde.kmymoney
  - gnucash
  - hibiscus
  - moneyplex

  # Was sonst noch Geheimnisse im Klartext zeigt.
  - org.gnome.Seahorse           # Schluesselbund
  - seahorse
  - org.kde.kwalletmanager5
  - kwalletmanager5

# Eigene Ergaenzungen gehoeren hierunter oder in eine Kopie dieser Datei
# unter $XDG_CONFIG_HOME/daimon/redaktion.yaml -- die hat Vorrang.


# T-7.3 -- bei welchen Anwendungen der Mitschnitt automatisch pausiert.
#
# ANDERS ALS DIE DENYLIST: was hier steht, ERGAENZT die mitgelieferte Liste
# (Zoom, Teams, Skype, Discord, Jitsi, Webex, Signal -- sie steht in
# daimon/recorder/pause.py). Wer Zoom ergaenzen will, soll nicht Teams neu
# tippen muessen. Die Denylist dagegen ersetzt, weil wer sie ueberschreibt
# genau das will.
#
# Verglichen wird als TEILTREFFER und ohne Ruecksicht auf Gross- und
# Kleinschreibung: `zoom` fangt auch `Zoom Workplace`. Die Richtung des
# Irrtums ist die harmlose -- ein Fehltreffer pausiert den Mitschnitt, er
# startet keinen.
#
# Leer gelassen gilt die Vorgabe. Der Abschnitt steht hier, weil der
# Parameter bis zum 19.08. im Code stand, ohne dass ihn je jemand fuellte.

konferenz: []
  # - element                     # Matrix-Klient mit Anrufen
  # - org.mozilla.firefox         # falls Konferenzen im Browser laufen
