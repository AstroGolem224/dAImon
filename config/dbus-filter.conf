# T-4.7 — die zweite Schicht: xdg-dbus-proxy vor dem DBus-Broker.
#
# Die erste Schicht ist der Broker selbst (daimon/brokers/dbus/broker.py): er
# kennt nur feste Operationen aus dem freigegebenen Katalog. Diese Datei ist
# NICHT die Begründung dafür, dass die erste Schicht schwach sein dürfte --
# sie fängt den Fall ab, in dem der Broker einen Fehler hat, und umgekehrt.
#
# Die Voreinstellung dieses Proxys IST Verweigerung. Erlaubt wird durch
# --see/--talk/--own/--call; einen Verbots-Operator gibt es nicht (man 1
# xdg-dbus-proxy). Was hier nicht steht, ist damit verboten.
#
# Aufruf: config/systemd/daimon-dbus-proxy.service. `--args=FD` liest
# NUL-getrennte Argumente; die Unit erzeugt sie aus dieser Datei, indem sie
# Kommentar- und Leerzeilen entfernt.

# Voreinstellung: nichts. Ein Proxy, der ohne Regel etwas durchlässt, ist kein
# Filter, sondern eine Weiterleitung.
--filter

# Genau ein Dienst. `kglobalaccel` löst Kurzbefehle aus, die im Katalog
# freigegeben sind; welcher davon, entscheidet der Broker.
# Der Aufruf liegt am Komponentenobjekt (am 10.08. gemessen; an
# /kglobalaccel gibt es die Methode nicht).
--call=org.kde.kglobalaccel=org.kde.kglobalaccel.Component.invokeShortcut@/component/*

# Lesende Aufrufe, die der Broker beim Start braucht, um seine
# Operationstabelle gegen die Wirklichkeit zu halten.
--call=org.kde.kglobalaccel=org.kde.KGlobalAccel.allMainComponents@/kglobalaccel
--call=org.kde.kglobalaccel=org.kde.KGlobalAccel.allActionsForComponent@/kglobalaccel

# org.kde.KWin und org.kde.kwin.Scripting stehen NICHT in dieser Datei. Genau
# das ist das Verbot: `loadScript` wäre beliebiges JavaScript im Compositor.

# Mitschrift an. Ohne sie ist "der Versuch wurde abgewiesen" eine Behauptung
# ohne Beleg -- der Prüfstand T-4.7.sh liest genau dieses Protokoll.
--log
