[package]
name = "face"
version = "0.1.0"
edition = "2021"
description = "dAImon Overlay: wlr-layer-shell, wl_shm, kein GPU-Kontext"
license = "MIT"

# Crates nach Design 8.1. Bewusst KEIN Toolkit mit eigenem Renderer:
# ein wl_shm-Client erzeugt kein EGL, kein Vulkan, kein GBM und keinen
# Explicit-Sync-Handshake. Damit entfaellt die gesamte
# NVIDIA-Blackwell-Risikoklasse strukturell -- gemessen in Spike T-1.3:
# null DRI-Deskriptoren, null GPU-Bibliotheken, 0,17 % Idle-CPU.
[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
png = "0.17"
serde_json = "1"
libc = "0.2"

[[bin]]
name = "daimon-face"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = "s"
