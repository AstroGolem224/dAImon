# T-4.7 — die zweite Schicht: xdg-dbus-proxy vor dem DBus-Broker.
#
# GUT-MUSTER-FASSUNG (Reviewer, T-4.7.v). Sie unterscheidet sich vom
# Arbeitsbaum an genau einer Stelle, siehe HERKUNFT.txt: die fuenf
# "AUSDRUECKLICH NICHT"-Zeilen sind fort. Nicht, weil das Verbot falsch waere
# -- sondern weil xdg-dbus-proxy sie nicht kennt und beim ersten Versuch,
# damit zu starten, abbricht:
#
#   'org.kde.kwin.Scripting=none' is not a valid dbus name
#
# Die Voreinstellung dieses Proxys IST Verweigerung. Erlaubt wird durch
# --see/--talk/--own/--call; einen Verbots-Operator gibt es nicht (man 1
# xdg-dbus-proxy). Was hier nicht steht, ist damit verboten -- und was hier
# als Verbot STAND, machte die Datei unbrauchbar und damit alle Erlaubnisse
# darin wirkungslos.
#
# Die erste Schicht ist der Broker selbst (daimon/brokers/dbus/broker.py): er
# kennt nur feste Operationen aus dem freigegebenen Katalog. Diese Datei ist
# NICHT die Begruendung dafuer, dass die erste Schicht schwach sein duerfte --
# sie faengt den Fall ab, in dem der Broker einen Fehler hat, und umgekehrt.
#
# Aufruf: config/systemd/daimon-dbus-proxy.service. `--args=FD` liest
# NUL-getrennte Argumente (man 1 xdg-dbus-proxy); die Unit erzeugt sie aus
# dieser Datei, indem sie Kommentar- und Leerzeilen entfernt.

# Voreinstellung: nichts. Ein Proxy, der ohne Regel etwas durchlaesst, ist kein
# Filter, sondern eine Weiterleitung.
--filter

# Genau ein Dienst. `kglobalaccel` loest Kurzbefehle aus, die im Katalog
# freigegeben sind; welcher davon, entscheidet der Broker -- diese Regel
# unterscheidet sie NICHT, sie kennt nur Methode und Objektpfad.
--call=org.kde.kglobalaccel=org.kde.kglobalaccel.Component.invokeShortcut@/component/*

# Lesende Aufrufe, die der Broker beim Start braucht, um seine
# Operationstabelle gegen die Wirklichkeit zu halten.
--call=org.kde.kglobalaccel=org.kde.KGlobalAccel.allMainComponents@/kglobalaccel
--call=org.kde.kglobalaccel=org.kde.KGlobalAccel.allActionsForComponent@/kglobalaccel

# org.kde.KWin und org.kde.kwin.Scripting stehen NICHT in dieser Datei. Genau
# das ist das Verbot: `loadScript` waere beliebiges JavaScript im Compositor.

# Mitschrift an. Ohne sie ist "der Versuch wurde abgewiesen" eine Behauptung
# ohne Beleg -- der Pruefstand T-4.7.sh liest genau dieses Protokoll.
--log
